<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEU FC - Contact</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="navbar">
            <h2>NEU <span>FC</span></h2>
            <ul class="nav-links">
                <li><a href="football-home.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="training.html">Training</a></li>
                <li><a href="facilities.html">Facilities</a></li>
                <li><a href="pricing.html">Pricing</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </div>
    </header>

    <div class="container">
        <h2>Join the Squad</h2>
        <p>Are you ready to commit? Fill out the form below to request a trial or ask questions about our programs.</p>
        
        <form action="#" method="POST">
            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" name="name" required>
            </div>
            <div class="form-group">
                <label for="email">University E-mail</label>
                <input type="email" id="email" name="email" required>
            </div>
            <div class="form-group">
                <label for="position">Preferred Position</label>
                <input type="text" id="position" name="position" placeholder="e.g., Striker, Center Back">
            </div>
            <div class="form-group">
                <label for="message">Your Message</label>
                <textarea id="message" name="message" rows="4"></textarea>
            </div>
            <button type="submit" class="btn">Send Application</button>
        </form>
    </div>

    <footer>
        <p>&copy; 2026 NEU FC. Final Project by Berkay Gündoğdu.</p>
    </footer>

</body>
</html>
